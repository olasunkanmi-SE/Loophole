name: Gemini AI Code Review and Documentation

on:
  pull_request:
    branches: [main, develop, uat]

jobs:
  ai_tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }} # Checkout the pull request branch

      - name: Get git diff
        id: git_diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}
          if ! git rev-parse --verify origin/${{ github.base_ref }}; then
            echo "Error: Base branch does not exist"
            exit 1
          fi
          if ! git rev-parse --verify origin/${{ github.head_ref }}; then
            echo "Error: Head branch does not exist"
            exit 1
          fi
          git diff origin/${{ github.base_ref }} origin/${{ github.head_ref }} > diff.txt
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate GEMINI_API_KEY
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Error: GEMINI_API_KEY is not set"
            exit 1
          fi

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install

      - name: Create output directories
        run: |
          mkdir -p docs
          mkdir -p code-reviews

      - name: Run AI Generation
        id: ai_generation
        run: |
          prompt=$(cat .github/prompts/code-review.md)
          diff=$(cat diff.txt)
          output=$(node .github/scripts/gemini-api.js "$prompt" "$diff")
          if [ -z "$output" ]; then
            echo "Error: AI generation failed or returned empty output"
            exit 1
          fi
          echo "$output" | jq -e '.' > output.json || { echo "Error: Invalid JSON output"; exit 1; }
          echo "output=$output" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Process Code Review
        run: |
          review=$(jq -r '.code_review // "No code review generated"' output.json)
          timestamp=$(date +%s)
          echo "$review" > code-reviews/${timestamp}-code-review.md

      - name: Process Documentation
        run: |
          has_docs=$(jq -r '.documentation | length > 0' output.json)
          if [ "$has_docs" = "true" ]; then
            jq -c '.documentation | to_entries[]' output.json | while read -r entry; do
              file_path=$(echo "$entry" | jq -r '.key')
              documentation=$(echo "$entry" | jq -r '.value')
              doc_filename=$(basename "$file_path").md
              echo "$documentation" > docs/$doc_filename
            done
          else
            echo "No documentation generated, skipping documentation processing"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-outputs
          path: |
            code-reviews/
            docs/

      - name: Logging Outputs
        run: |
          echo "Generated Code Review:"
          cat code-reviews/*
          echo "Generated Documentation:"
          ls -R docs || echo "No documentation files generated"

      - name: Cleanup
        if: always()
        run: |
          rm -f diff.txt output.json
